<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7dbde2;
            padding: 20px;
            background-image: url("https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWJ5emY5ZHA1MWx1N2ZwbnF6bTRrenZhM2phdWxzZmZjeTRwNDU5aCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/12Eo7WogCAoj84/200.webp");
            background-size: 800px;
        }
        .container {
            background-color: #291438;
            background-image: url("https://t4.ftcdn.net/jpg/01/08/13/93/360_F_108139386_tM1B7HWbQhHUEs3EJbdNbsoJF1G3bEoK.jpg");
            background-size: 1910px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(49, 84, 73, 0.1);
            max-width: 800px;
            margin: auto;
        }
        h2 {
            text-align: center;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 12px;
            margin: 5px 0 22px 0;
            display: inline-block;
            border: 1px solid #6642a0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type=text]:focus, input[type=password]:focus {
            background-color: #84ea8e;
            outline: none;
        }
        label {
            margin-bottom: 10px;
            display: block;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border: none;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -16px;
        }
        .col-50 {
            flex: 50%;
            padding: 0 16px;
        }
        .col-50 input {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #fefdfd;">Payment Form</h2>
        <form action="/submit_payment" method="post">
            <div class="row">
                <div class="col-50">
                    <h3 style="color: #fefdfd;">Billing Address</h3>
                    <label style="color: #fefdfd;font-size: larger;" for="fname"><i class="fa fa-user"></i> Full Name</label>
                    <input type="text" id="fname" name="firstname" placeholder="Jake paul">
                    <label style="color: #fefdfd;font-size: larger;" for="email"><i class="fa fa-envelope"></i> Email</label>
                    <input type="text" id="email" name="email" placeholder="jake69@example.com">
                    <label style="color: #fefdfd;font-size: larger;" for="adr"><i class="fa fa-address-card-o"></i> Address</label>
                    <input type="text" id="adr" name="address" placeholder="542 W. 15th Street">
                    <label style="color: #fefdfd;font-size: larger;" for="city"><i class="fa fa-institution"></i> City</label>
                    <input type="text" id="city" name="city" placeholder="New York">
                    <div class="row">
                        <div class="col-50">
                            <label style="color: #fefdfd;font-size: larger;" for="state">State</label>
                            <input type="text" id="state" name="state" placeholder="NY">
                        </div>
                        <div class="col-50">
                            <label style="color: #fefdfd;font-size: larger;" for="zip">Zip</label>
                            <input type="text" id="zip" name="zip" placeholder="10001">
                        </div>
                    </div>
                </div>
                <div class="col-50">
                    <h3 style="color: #aca9a9;">Payment</h3>
                    <label style="color: #bfb8b8;font-size: larger;" for="cname">Name on Card</label>
                    <input type="text" id="cname" name="cardname" placeholder="John More Doe">
                    <label style="color: #fefdfd;font-size: larger;"for="ccnum">Credit card number</label>
                    <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444">
                    <label style="color: #fefdfd;font-size: larger;"for="expmonth">Exp Month</label>
                    <input type="text" id="expmonth" name="expmonth" placeholder="September">
                    <div class="row">
                        <div class="col-50">
                            <label style="color: #fefdfd;font-size: larger;" for="expyear">Exp Year</label>
                            <input type="text" id="expyear" name="expyear" placeholder="2024">
                        </div>
                        <div class="col-50">
                            <label style="color: #fefdfd;font-size: larger;" for="cvv">CVV</label>
                            <input type="text" id="cvv" name="cvv" placeholder="352">
                        </div>
                    </div>
                </div>
            </div>
            <label style="color: #fefdfd;">
                <input style="color: #fefdfd;" type="checkbox" checked="checked" name="sameadr"> Shipping address same as billing
            </label>
            <label style="color: #fefdfd;">
                <input style="color: #fefdfd;" type="checkbox" checked="checked" name="sameadr"> accept all cookies
            </label>
            <label style="color: #fefdfd;">
                <input style="color: #fefdfd;" type="checkbox" checked="checked" name="sameadr">privete policys
            </label>
            <a href="out.html"><input type="out.html" value="Continue to checkout" class="btn"></a>
        </form>
    </div>
</body>
</html>
